name: CI

on:
  push:
    # must stay in sync with `branches` in release.config.js — a release branch missing here
    # publishes nothing, with no failure to alert you
    branches: [master, alpha, beta]
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "yarn"
      - name: install dependencies
        run: yarn --immutable
      - name: lint
        run: yarn lint

  test:
    name: Testing
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "yarn"
      - name: install dependencies
        run: yarn --immutable
      - name: test
        run: yarn test

  release:
    name: Building and releasing project
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: write # create tags and GitHub Releases (no release commit — see release.config.js)
      issues: write # @semantic-release/github comments on resolved issues
      pull-requests: write # @semantic-release/github comments on merged PRs
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "yarn"
      - name: install dependencies
        run: yarn --immutable
      - name: build
        run: |
          yarn build:ts
          sed 's/dist\//.\//' package.json > dist/package.json
          cp yarn.lock dist/yarn.lock
          cp .yarnrc.yml dist/.yarnrc.yml
          cp README.md dist/README.md
      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          yarn --immutable
          yarn semantic-release
